[package]
name = "actunime-adblock"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Moteur de filtres de Brave (MPL-2.0). Sans `single-thread`, l'`Engine` est `Send + Sync` : la WebView
# appelle `shouldInterceptRequest` depuis plusieurs threads.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
