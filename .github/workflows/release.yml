name: Release APK

# Secrets requis (Settings → Secrets and variables → Actions) :
#   - BETA_API_URL            : ex. https://api.beta.actunime.fr
#   - BETA_WEB_URL            : ex. https://beta.actunime.fr
#   - ANDROID_KEYSTORE_BASE64 : keystore de signature encodé en base64 (`base64 -w0 actunime.jks`)
#   - ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# La même clé doit signer toutes les versions : sinon Android refuse la mise à jour par-dessus l'ancienne.

permissions:
  contents: write

on:
  push:
    branches:
      - beta

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installation des dépendances
        run: npm ci

      - name: Bundle du script de détection injecté
        run: npm run build:injected

      - name: Génération du projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Build de l'APK (non signé)
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.BETA_API_URL }}
          EXPO_PUBLIC_WEB_URL: ${{ secrets.BETA_WEB_URL }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Alignement et signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "actunime-mobile-beta-${{ github.run_number }}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publication de la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-beta.${{ github.run_number }}" \
            "actunime-mobile-beta-${{ github.run_number }}.apk" \
            --prerelease \
            --title "Actunime Mobile beta ${{ github.run_number }}" \
            --notes "APK Android signé, à installer à la main (autoriser les sources inconnues)."
